# Staging-only service definition. Merge the services into the Freddy Compose
# project after the API, worker, and bind mounts have been validated there.
services:
  shelfmark-api:
    build: .
    image: shelfmark:dev
    container_name: shelfmark-api
    command: ["shelfmark-api"]
    env_file:
      - .env
    environment:
      SHELFMARK_DB_PATH: /data/shelfmark.db
      SHELFMARK_AUDIOBOOKS_ROOT: /audiobooks
      SHELFMARK_EBOOKS_ROOT: /ebooks
      SHELFMARK_INCOMING_ROOT: /incoming
      SHELFMARK_WORK_ROOT: /work
      SHELFMARK_QUARANTINE_ROOT: /quarantine
    ports:
      - "127.0.0.1:8110:8000"
    volumes:
      - /mnt/1tb/shelfmark/data:/data
      - /mnt/1tb/audiobooks:/audiobooks
      - /mnt/1tb/ebooks:/ebooks
      - /mnt/1tb/shelfmark/incoming:/incoming
      - /mnt/1tb/shelfmark/work:/work
      - /mnt/1tb/shelfmark/quarantine:/quarantine
    user: "${PUID:-1001}:${PGID:-1001}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  shelfmark-worker:
    build: .
    image: shelfmark:dev
    container_name: shelfmark-worker
    command: ["shelfmark-worker"]
    env_file:
      - .env
    environment:
      SHELFMARK_DB_PATH: /data/shelfmark.db
      SHELFMARK_AUDIOBOOKS_ROOT: /audiobooks
      SHELFMARK_EBOOKS_ROOT: /ebooks
      SHELFMARK_INCOMING_ROOT: /incoming
      SHELFMARK_WORK_ROOT: /work
      SHELFMARK_QUARANTINE_ROOT: /quarantine
      SHELFMARK_WORKER_ID: shelfmark-worker
    volumes:
      - /mnt/1tb/shelfmark/data:/data
      - /mnt/1tb/audiobooks:/audiobooks
      - /mnt/1tb/ebooks:/ebooks
      - /mnt/1tb/shelfmark/incoming:/incoming
      - /mnt/1tb/shelfmark/work:/work
      - /mnt/1tb/shelfmark/quarantine:/quarantine
    user: "${PUID:-1001}:${PGID:-1001}"
    restart: unless-stopped
    # The worker serves no HTTP of its own, and the image is python-slim --
    # no curl (verified: only openssh-client/rsync/7zip/unrar-free are
    # installed, for the Sullivan transfer, not for this). `shelfmark-worker-
    # healthcheck` (installed by pyproject.toml, see worker.py's
    # `check_liveness_cli`) reads the worker's own `worker_liveness` row
    # locally through the exact same `Database.worker_liveness_status`
    # classifier `/readyz` uses -- previously this was an inline `python -c`
    # one-liner that checked liveness age only, with no exception for a job
    # still legitimately running, so `docker ps` showed `unhealthy` during
    # any long transfer even after `/readyz` was fixed to say `busy` for the
    # same situation. One shared classifier is what keeps that from
    # happening again.
    healthcheck:
      test: ["CMD", "shelfmark-worker-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
