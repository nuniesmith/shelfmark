[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "shelfmark"
version = "0.1.0"
description = "Organize audiobook and ebook dumps for Audiobookshelf-compatible libraries"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
dependencies = [
    "rarfile==4.2",
    "mutagen==1.47.0",
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
]

[project.scripts]
shelfmark = "main:main"
shelfmark-fix-metadata = "fix_metadata:main"
shelfmark-api = "shelfmark_service.api:main"
shelfmark-worker = "shelfmark_service.worker:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["main", "fix_metadata"]

[tool.setuptools.packages.find]
where = ["src"]
