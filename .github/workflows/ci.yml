name: Shelfmark CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Compile sources
        run: python -m compileall -q src tests

  # On a pull request the image is only built, never published — a PR must not
  # be able to move a tag that a server pulls.
  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Build CLI and service image
        run: docker build --tag shelfmark:ci .

      # The unit tests inject a fake subprocess runner, so a binary missing from
      # the image passes every test and then fails on a real transfer with
      # "rsync: not found". Assert against the image itself instead.
      - name: Required binaries are present in the image
        run: |
          missing=0
          for bin in rsync ssh tar; do
            if docker run --rm --entrypoint sh shelfmark:ci -c "command -v $bin" >/dev/null 2>&1; then
              echo "  ok       $bin"
            else
              echo "  MISSING  $bin"; missing=1
            fi
          done
          # Archive extraction has a fallback chain, so any one of these will do.
          if docker run --rm --entrypoint sh shelfmark:ci \
               -c 'command -v 7z || command -v 7za || command -v 7zz' >/dev/null 2>&1; then
            echo "  ok       7z (one of 7z/7za/7zz)"
          else
            echo "  MISSING  7z family"; missing=1
          fi
          if docker run --rm --entrypoint sh shelfmark:ci \
               -c 'command -v unrar || command -v unar' >/dev/null 2>&1; then
            echo "  ok       unrar (one of unrar/unar)"
          else
            echo "  MISSING  unrar family"; missing=1
          fi
          exit $missing

      # The image sets ENTRYPOINT [], so arguments REPLACE the CMD rather than
      # appending to it — `docker run image --help` tries to exec "--help" as a
      # binary. Name the console script explicitly.
      - name: Console entry points run
        run: |
          docker run --rm shelfmark:ci shelfmark --help > /dev/null
          docker run --rm shelfmark:ci shelfmark-fix-metadata --help > /dev/null
          echo "  ok       CLI entry points"

      # This one runs against Sullivan in production, so CI can only confirm it
      # is on PATH, parses, and refuses to run unconfigured rather than
      # silently reporting success — which is the exact failure it exists to
      # catch in the account it checks.
      - name: Sync verification script is shipped and sound
        run: |
          docker run --rm --entrypoint bash shelfmark:ci -n /usr/local/bin/verify-sullivan-sync
          echo "  ok       verify-sullivan-sync parses"
          if docker run --rm --entrypoint verify-sullivan-sync shelfmark:ci >/dev/null 2>&1; then
            echo "  FAIL     verify-sullivan-sync exited 0 with no host configured"; exit 1
          fi
          echo "  ok       verify-sullivan-sync refuses an unconfigured run"

  # Freddy pulls this image; it has no copy of the source and cannot build it
  # itself. Without this job the Compose services there have nothing to start.
  publish:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # `latest` is what Freddy's Compose tracks. The commit SHA tag is the
          # one to pin to when rolling back, since `latest` moves.
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Freddy's Compose tracks `latest`, but nothing told freddy a new one
      # existed: an image published here reached it only on the next, unrelated
      # freddy deploy. This asks freddy to roll out exactly this commit
      # (nuniesmith/freddy update-service.yml), which recreates only these
      # services and checks they run this revision.
      #
      # FREDDY_DEPLOY_TOKEN is a fine-grained PAT with Actions: write on
      # nuniesmith/freddy alone -- GITHUB_TOKEN cannot start a workflow in
      # another repository. A missing token FAILS this job rather than skipping:
      # a silent skip is a deploy that never happened, reported as green.
      - name: Roll this commit out on freddy
        env:
          GH_TOKEN: ${{ secrets.FREDDY_DEPLOY_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::FREDDY_DEPLOY_TOKEN is not set, so freddy keeps running the previous image"
            exit 1
          fi
          gh workflow run update-service.yml --repo nuniesmith/freddy \
            -f image=ghcr.io/${{ github.repository }} \
            -f revision=${{ github.sha }} \
            -f services="shelfmark-api shelfmark-worker shelfmark-bot"
          echo "Requested: ${{ github.server_url }}/nuniesmith/freddy/actions/workflows/update-service.yml"
